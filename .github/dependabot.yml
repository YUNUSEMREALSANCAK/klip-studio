version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      ai-and-media:
        patterns: ['@huggingface/*', '@mediapipe/*', 'mediabunny', '@shiguredo/*']
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
